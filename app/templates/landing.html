<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0c0f">
    <meta name="color-scheme" content="dark">
    <title>{{ seo.title }}</title>
    <meta name="description" content="{{ seo.description }}">
    <meta name="keywords" content="{{ seo.keywords }}">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="{{ seo.canonical }}">
    <link rel="icon" href="{{ url_for('static', filename='landing/favicon.svg') }}" type="image/svg+xml">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AI 家宽 · ChatGPT 防降智节点">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="{{ seo.title }}">
    <meta property="og:description" content="{{ seo.description }}">
    <meta property="og:url" content="{{ seo.canonical }}">
    <meta property="og:image" content="{{ seo.og_image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ seo.title }}">
    <meta name="twitter:description" content="{{ seo.description }}">
    <meta name="twitter:image" content="{{ seo.og_image }}">

    <!-- Structured data -->
    {% for block in seo.jsonld %}
    <script type="application/ld+json">{{ block | tojson }}</script>
    {% endfor %}

    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="{{ url_for('static', filename='landing/fonts/noto-serif-sc-subset.woff2') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='landing/landing.css') }}">
    <script>
      window.__BOOT__ = {{ boot | tojson }};
    </script>
  </head>
  <body>
    <div id="app"></div>

    <noscript>
      <main style="max-width:760px;margin:0 auto;padding:40px 20px;color:#ECEDEF;background:#0b0c0f;font-family:system-ui,-apple-system,'PingFang SC','Noto Sans SC',sans-serif;line-height:1.7">
        <h1>满血智力，全程不降级 — AI 家宽 · ChatGPT 防降智节点</h1>
        <p>{{ seo.description }}</p>
        <p>支持 ChatGPT / Claude / Gemini，原生家宽 IP 出口，独享不超售、多路高可用、端到端加密。</p>

        <h2>五重保障</h2>
        <ul>
          {% for f in seo.features %}
          <li><strong>{{ f.title }}</strong>：{{ f.desc }}</li>
          {% endfor %}
        </ul>

        <h2>透明定价</h2>
        <p>¥{{ seo.price }} / 月起，独立端口与带宽配额，绝不超卖。</p>

        <h2>常见问题</h2>
        <dl>
          {% for item in seo.faqs %}
          <dt><strong>{{ item.q }}</strong></dt>
          <dd>{{ item.a }}</dd>
          {% endfor %}
        </dl>

        <p>
          <a href="/plans" style="color:#6BA5FF">查看套餐</a> ·
          <a href="/portal" style="color:#6BA5FF">订阅中心</a>
        </p>
        <p style="color:#9CA1AA">本页为动态页面，请启用 JavaScript 以获得完整体验。</p>
      </main>
    </noscript>

    <script type="module" src="{{ url_for('static', filename='landing/landing.js') }}"></script>
  </body>
</html>
