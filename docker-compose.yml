name: xray-routing-panel

services:
  xray-routing-panel:
    build: .
    container_name: xray-routing-panel
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      PANEL_PORT: "18080"
      PANEL_HOST: "127.0.0.1"
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:-https://xray.zrhe2016.cc}"
      PANEL_SUBSCRIPTION_PUBLIC_URL: "${PANEL_SUBSCRIPTION_PUBLIC_URL:-https://sub.xray.zrhe2016.cc}"
      DEFAULT_UPSTREAM_HOST: "127.0.0.1"
      DEFAULT_UPSTREAM_PORT: "443"
      SEED_LISTEN_PORT: "31098"
      XRAY_ENV_FILE_PATH: "/app/xray/.env"
      XRAY_CONFIG_PATH: "/app/xray/runtime/config.json"
      XRAY_PANEL_PORTS_PATH: "/app/xray/runtime/panel-ports.json"
      XRAY_ACCESS_LOG_PATH: "/app/xray/logs/access.log"
      XRAY_CLIENT_CONFIG_PATH: "/app/xray/runtime/client-test.json"
      AI_ROUTING_ENABLED: "${AI_ROUTING_ENABLED:-1}"
      DATAPLANE_SSH_TARGET: "${DATAPLANE_SSH_TARGET:-}"
      DATAPLANE_SSH_OPTIONS: "${DATAPLANE_SSH_OPTIONS:-}"
      DATAPLANE_REMOTE_COMMAND_TIMEOUT: "${DATAPLANE_REMOTE_COMMAND_TIMEOUT:-8}"
      DATAPLANE_API_SERVER: "${DATAPLANE_API_SERVER:-127.0.0.1:10085}"
      DATAPLANE_CONFIG_PATH: "${DATAPLANE_CONFIG_PATH:-}"
      DATAPLANE_DYNAMIC_ROUTING_PATH: "${DATAPLANE_DYNAMIC_ROUTING_PATH:-}"
      DATAPLANE_AI_REPORT_PATH: "${DATAPLANE_AI_REPORT_PATH:-}"
      DATAPLANE_PANEL_DB_PATH: "${DATAPLANE_PANEL_DB_PATH:-}"
      DATAPLANE_PANEL_PORTS_PATH: "${DATAPLANE_PANEL_PORTS_PATH:-}"
      DATAPLANE_ACCESS_LOG_PATH: "${DATAPLANE_ACCESS_LOG_PATH:-}"
      DATAPLANE_RESTART_COMMAND: "${DATAPLANE_RESTART_COMMAND:-}"
      DATAPLANE_CONTAINER_NAME: "${DATAPLANE_CONTAINER_NAME:-xray-reality-local}"
      # 容器内 docker CLI(20.10/API1.41) 比宿主 daemon(最低API1.44)旧，强制协商版本，否则 docker inspect 失败导致数据面被误判为未运行
      DOCKER_API_VERSION: "${DOCKER_API_VERSION:-1.44}"
      DATAPLANE_PROBE_HOST: "${DATAPLANE_PROBE_HOST:-127.0.0.1}"
      AI_NODE_SSH_TARGET: "${AI_NODE_SSH_TARGET:-}"
      AI_NODE_SSH_BIN: "${AI_NODE_SSH_BIN:-ssh}"
      AI_NODE_SSH_OPTIONS: "${AI_NODE_SSH_OPTIONS:-}"
      AI_NODE_SSH_KEY_FILE: "${AI_NODE_SSH_KEY_FILE:-/run/secrets/fleet_ssh_key}"
      AI_NODE_CONTAINER_NAME: "${AI_NODE_CONTAINER_NAME:-xray-ai-node}"
      AI_NODE_RESTART_COMMAND: "${AI_NODE_RESTART_COMMAND:-}"
      AI_NODE_CONFIG_PATH: "${AI_NODE_CONFIG_PATH-/etc/xray/config.json}"
      AI_NODE_API_SERVER: "${AI_NODE_API_SERVER:-127.0.0.1:10085}"
      AI_NODE_PROBE_HOST: "${AI_NODE_PROBE_HOST:-}"
      AI_NODE_XRAY_BIN: "${AI_NODE_XRAY_BIN:-/usr/local/bin/xray}"
      AI_NODE_DOCKER_BIN: "${AI_NODE_DOCKER_BIN:-docker}"
      DNS_FAILOVER_ENABLED: "${DNS_FAILOVER_ENABLED:-0}"
      DNS_FAILOVER_INTERVAL: "${DNS_FAILOVER_INTERVAL:-15}"
      DNS_FAILOVER_TIMEOUT: "${DNS_FAILOVER_TIMEOUT:-3}"
      DNS_FAILOVER_FAILURE_THRESHOLD: "${DNS_FAILOVER_FAILURE_THRESHOLD:-3}"
      DNS_FAILOVER_RECOVERY_THRESHOLD: "${DNS_FAILOVER_RECOVERY_THRESHOLD:-2}"
      DNS_FAILOVER_PROBE_HOST: "${DNS_FAILOVER_PROBE_HOST:-}"
      DNS_FAILOVER_PROBE_PORT: "${DNS_FAILOVER_PROBE_PORT:-}"
      CF_API_TOKEN: "${CF_API_TOKEN:-}"
      CF_ZONE_ID: "${CF_ZONE_ID:-}"
      CF_DNS_RECORD_ID: "${CF_DNS_RECORD_ID:-}"
      CF_DNS_RECORD_TYPE: "${CF_DNS_RECORD_TYPE:-A}"
      CF_DNS_RECORD_NAME: "${CF_DNS_RECORD_NAME:-}"
      CF_DNS_RECORD_PROXIED: "${CF_DNS_RECORD_PROXIED:-0}"
      CF_DNS_RECORD_TTL: "${CF_DNS_RECORD_TTL:-60}"
      DNS_FAILOVER_PRIMARY_CONTENT: "${DNS_FAILOVER_PRIMARY_CONTENT:-}"
      CONTROL_PLANE_BACKUP_XRAY_ENABLED: "${CONTROL_PLANE_BACKUP_XRAY_ENABLED:-0}"
      CONTROL_PLANE_BACKUP_UPSTREAM_URL: "${CONTROL_PLANE_BACKUP_UPSTREAM_URL:-}"
      DNS_FAILOVER_BACKUP_CONTENT: "${DNS_FAILOVER_BACKUP_CONTENT:-}"
      DNS_FAILOVER_BACKUP_LABEL: "${DNS_FAILOVER_BACKUP_LABEL:-控制面备用Xray}"
      DNS_FAILOVER_PEAK_ENABLED: "${DNS_FAILOVER_PEAK_ENABLED:-0}"
      DNS_FAILOVER_PEAK_START: "${DNS_FAILOVER_PEAK_START:-}"
      DNS_FAILOVER_PEAK_END: "${DNS_FAILOVER_PEAK_END:-}"
      DNS_FAILOVER_PEAK_TIMEZONE: "${DNS_FAILOVER_PEAK_TIMEZONE:-}"
      PANEL_USERNAME: "${PANEL_USERNAME:-}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:-}"
      PANEL_SECRET_KEY: "${PANEL_SECRET_KEY:-}"
      PROBE_ENABLED: "1"
      PROBE_INTERVAL: "180"
      PROBE_TEST_LISTEN_PORT: "31098"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      METRICS_DP_TTL: "${METRICS_DP_TTL:-30}"
    volumes:
      - ./data:/data
      - ./app/xray:/app/xray
      - /root/.ssh/xray_fleet_ed25519_20260805:/run/secrets/fleet_ssh_key:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - /root/.ssh/known_hosts_ai:/root/.ssh/known_hosts_ai:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  xray-routing-panel-db-backup:
    build: .
    container_name: xray-routing-panel-db-backup
    restart: unless-stopped
    command: ["sh", "/app/scripts/start-backup-cron.sh"]
    environment:
      DB_PATH: "/data/panel.db"
      DB_BACKUP_DIR: "/backups"
      DB_BACKUP_KEEP_DAYS: "7"
      DB_BACKUP_PREFIX: "xray-routing-panel"
      DB_BACKUP_R2_ENABLED: "${DB_BACKUP_R2_ENABLED:-0}"
      DB_BACKUP_R2_ENDPOINT: "${DB_BACKUP_R2_ENDPOINT:-}"
      DB_BACKUP_R2_BUCKET: "${DB_BACKUP_R2_BUCKET:-}"
      DB_BACKUP_R2_ACCESS_KEY_ID: "${DB_BACKUP_R2_ACCESS_KEY_ID:-}"
      DB_BACKUP_R2_SECRET_ACCESS_KEY: "${DB_BACKUP_R2_SECRET_ACCESS_KEY:-}"
      DB_BACKUP_R2_REGION: "${DB_BACKUP_R2_REGION:-auto}"
      DB_BACKUP_R2_PREFIX: "${DB_BACKUP_R2_PREFIX:-xray-routing-panel}"
      DB_BACKUP_R2_RECORD_PATH: "/backups/r2-upload-record.json"
      DB_BACKUP_ENCRYPTION_PASSWORD: "${DB_BACKUP_ENCRYPTION_PASSWORD:-}"
      # The bundle is an encrypted, offline disaster-recovery archive.  Keep
      # the rendered Xray environment/configuration beside the database.
      DB_BACKUP_BUNDLE_ENABLED: "${DB_BACKUP_BUNDLE_ENABLED:-1}"
      DB_BACKUP_BUNDLE_DIR: "${DB_BACKUP_BUNDLE_DIR:-/backups}"
      DB_BACKUP_BUNDLE_KEEP_DAYS: "${DB_BACKUP_BUNDLE_KEEP_DAYS:-7}"
      DB_BACKUP_BUNDLE_PREFIX: "${DB_BACKUP_BUNDLE_PREFIX:-xray-routing-panel}"
      DB_BACKUP_EXTRA_PATHS: "${DB_BACKUP_EXTRA_PATHS:-/project/docker-compose.yml,/project/docker-compose.ops-reporting.yml,/project/docker-compose.ops-reporting.deploy.yml,/project/.env,/project/.env.ops-reporting,/project/.env.example,/project/k8s,/project/app/xray/.env,/project/app/xray/runtime,/project/scripts}"
      # Read the actual normal/AI node files over SSH before bundling.  The AI
      # NAT entry is intentionally explicit: production SSH is on port 27160.
      DB_BACKUP_SSH_COLLECTION_ENABLED: "${DB_BACKUP_SSH_COLLECTION_ENABLED:-1}"
      DB_BACKUP_SSH_COLLECTION_REQUIRED: "${DB_BACKUP_SSH_COLLECTION_REQUIRED:-0}"
      DB_BACKUP_SSH_KEY_PATH: "${DB_BACKUP_SSH_KEY_PATH:-/run/secrets/fleet_ssh_key}"
      DB_BACKUP_SSH_KNOWN_HOSTS: "${DB_BACKUP_SSH_KNOWN_HOSTS:-/root/.ssh/known_hosts}"
      DB_BACKUP_SSH_OPTIONS: "${DB_BACKUP_SSH_OPTIONS:-}"
      DB_BACKUP_SSH_TIMEOUT_SECONDS: "${DB_BACKUP_SSH_TIMEOUT_SECONDS:-20}"
      DB_BACKUP_SSH_MAX_FILE_BYTES: "${DB_BACKUP_SSH_MAX_FILE_BYTES:-5242880}"
      DB_BACKUP_DATAPLANE_SSH_TARGET: "${DB_BACKUP_DATAPLANE_SSH_TARGET:-root@64.186.224.96}"
      DB_BACKUP_DATAPLANE_SSH_PORT: "${DB_BACKUP_DATAPLANE_SSH_PORT:-22}"
      DB_BACKUP_DATAPLANE_KNOWN_HOSTS: "${DB_BACKUP_DATAPLANE_KNOWN_HOSTS:-/root/.ssh/known_hosts}"
      DB_BACKUP_DATAPLANE_SSH_OPTIONS: "${DB_BACKUP_DATAPLANE_SSH_OPTIONS:-}"
      DB_BACKUP_DATAPLANE_CONFIG_PATH: "${DB_BACKUP_DATAPLANE_CONFIG_PATH:-}"
      DB_BACKUP_DATAPLANE_REMOTE_PATHS: "${DB_BACKUP_DATAPLANE_REMOTE_PATHS:-/root/xray-routing-panel/app/xray/runtime/config.json,/root/xray-routing-panel/app/xray/.env}"
      DB_BACKUP_AI_NODE_SSH_TARGET: "${DB_BACKUP_AI_NODE_SSH_TARGET:-root@nat.qq.pw}"
      DB_BACKUP_AI_NODE_SSH_PORT: "${DB_BACKUP_AI_NODE_SSH_PORT:-27160}"
      DB_BACKUP_AI_NODE_KNOWN_HOSTS: "${DB_BACKUP_AI_NODE_KNOWN_HOSTS:-/root/.ssh/known_hosts_ai}"
      DB_BACKUP_AI_NODE_SSH_OPTIONS: "${DB_BACKUP_AI_NODE_SSH_OPTIONS:-}"
      DB_BACKUP_AI_NODE_CONFIG_PATH: "${DB_BACKUP_AI_NODE_CONFIG_PATH:-}"
      DB_BACKUP_AI_NODE_REMOTE_PATHS: "${DB_BACKUP_AI_NODE_REMOTE_PATHS:-/etc/xray/config.json,/etc/xray/.env}"
      DB_BACKUP_CRON_SCHEDULE: "0 3 * * *"
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./app/xray:/app/xray:ro
      - ./:/project:ro
      - /srv/xray-ops:/ops-data:ro
      - /root/ssh-keys/xray_fleet_ed25519_20260805:/run/secrets/fleet_ssh_key:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - /root/.ssh/known_hosts_ai:/root/.ssh/known_hosts_ai:ro
      - ./logs:/var/log
  xray-reality:
    profiles: ["xray"]
    image: ghcr.io/xtls/xray-core:26.5.3
    container_name: xray-reality-local
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./app/xray/runtime/config.json:/etc/xray/config.json:ro
      - ./app/xray/logs:/var/log/xray
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "run", "-test", "-config", "/etc/xray/config.json"]
      interval: 30s
      timeout: 10s
      retries: 3
  xray-reality-backup:
    profiles: ["backup-xray"]
    image: ghcr.io/xtls/xray-core:26.5.3
    container_name: xray-reality-backup
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      # The backup node mounts its own relay config so it forwards failover
      # traffic to CONTROL_PLANE_BACKUP_UPSTREAM_URL instead of exiting directly.
      - ./app/xray/runtime/config-backup.json:/etc/xray/config.json:ro
      - ./app/xray/logs:/var/log/xray
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "run", "-test", "-config", "/etc/xray/config.json"]
      interval: 30s
      timeout: 10s
      retries: 3
  xray-ai-domain-manager:
    profiles: ["xray"]
    build:
      context: .
      dockerfile: app/xray/Dockerfile.ai-manager
    restart: unless-stopped
    depends_on:
      xray-reality:
        condition: service_started
    command: ["python", "-m", "app.xray.ai_domain_manager"]
    env_file:
      - ./app/xray/.env
    environment:
      XRAY_WORKSPACE_DIR: "/workspace/app/xray"
      PANEL_DB_PATH: "/panel-data/panel.db"
      AI_DOMAIN_INTERVAL_SECONDS: "3600"
      AI_DOMAIN_LOOKBACK_SECONDS: "3600"
      AI_DOMAIN_BATCH_SIZE: "50"
      CODEX_SOURCE_HOME: "/host-codex-home"
      CODEX_RUNTIME_HOME: "/workspace/app/xray/runtime/codex-home"
      CODEX_WORKDIR: "/tmp/codex-domain-classifier"
      CODEX_NODE_BIN: "/usr/bin/node"
      CODEX_NODE_VERSIONS_ROOT: "/host-node-versions"
      DATAPLANE_CONTAINER_NAME: "${DATAPLANE_CONTAINER_NAME:-xray-reality-local}"
      DOCKER_API_VERSION: "${DOCKER_API_VERSION:-1.44}"
      DATAPLANE_RESTART_CONTAINER: "${DATAPLANE_RESTART_CONTAINER:-xray-reality-local}"
      DATAPLANE_RESTART_COMMAND: "${DATAPLANE_RESTART_COMMAND:-}"
      DATAPLANE_CONFIG_PATH: "${DATAPLANE_CONFIG_PATH:-}"
      DATAPLANE_SSH_TARGET: "${DATAPLANE_SSH_TARGET:-}"
      DATAPLANE_SSH_OPTIONS: "${DATAPLANE_SSH_OPTIONS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace
      - ./data:/panel-data
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.ssh:/root/.ssh:ro
      - /root/.codex:/host-codex-home:ro
      - /root/.nvm/versions/node:/host-node-versions:ro
  xray-ai-node:
    profiles: ["ai-node"]
    image: ghcr.io/xtls/xray-core:26.5.3
    container_name: xray-ai-node
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./app/xray/runtime/config-ai-node.json:/etc/xray/config.json:ro
      - ./app/xray/logs:/var/log/xray
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "run", "-test", "-config", "/etc/xray/config.json"]
      interval: 30s
      timeout: 10s
      retries: 3
