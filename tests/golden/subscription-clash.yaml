port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxies:
  - name: "golden-plan-31098"
    type: vless
    server: "panel.example.com"
    port: 31098
    uuid: "11111111-1111-1111-1111-111111111111"
    udp: true
    tls: true
    network: tcp
    servername: "www.microsoft.com"
    flow: "xtls-rprx-vision"
    reality-opts:
      public-key: "synthetic-public-key"
      short-id: "0123456789abcdef"
    client-fingerprint: "chrome"

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "golden-plan-31098"
      - DIRECT

  - name: AUTO
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "golden-plan-31098"

