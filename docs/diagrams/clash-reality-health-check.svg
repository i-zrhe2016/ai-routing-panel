="spacing" textLength="235.5342" x="175.2626" y="688.1162">Temporary instance returns HTTP 204?</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="20.059" x="143.2036" y="678.7042">yes</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="15.808" x="422.7968" y="678.7042">no</text><rect fill="#FFFFFF" height="57.648" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="198.8411" x="43.804" y="704.4482"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="178.8411" x="53.804" y="729.5283">Fault boundary is the running</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="147.2381" x="69.6055" y="748.3523">production Xray process</text><rect fill="#FFFFFF" height="38.824" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="198.1521" x="44.1485" y="782.0963"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="178.1521" x="54.1485" y="807.1763">Restart only xray-reality-local</text><rect fill="#FFFFFF" height="57.648" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="274.4492" x="6" y="840.9203"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="254.4492" x="16" y="866.0003">Verify container health, external HTTP 204</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="150.5011" x="67.974" y="884.8243">and resumed access logs</text><rect fill="#FFFFFF" height="38.824" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="284.7712" x="300.4492" y="704.4482"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="264.7712" x="310.4492" y="729.5283">Repair the generated REALITY configuration</text><polygon fill="#FFFFFF" points="2