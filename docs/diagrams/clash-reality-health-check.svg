9.2001" y="242.5842">yes: 127/128</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="15.808" x="351.8882" y="242.5842">no</text><rect fill="#FFFFFF" height="57.648" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="229.0272" x="39.644" y="268.3282"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="209.0272" x="49.644" y="293.4082">Run a full VLESS + REALITY request</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="205.7512" x="51.282" y="312.2322">from independent external clients</text><rect fill="#FFFFFF" height="38.824" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="286.4612" x="288.6712" y="268.3282"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="266.4612" x="298.6712" y="293.4082">Inspect DNS, firewall and upstream network</text><ellipse cx="431.9018" cy="353.1522" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="431.9018" cy="353.1522" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#FFFFFF" points="196.0366,384.1522,390.0228,384.1522,402.0228,396.1522,390.0228,408.1522,196.0366,408.1522,184.0366,396.1522,196.0366,384.1522" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="193.9861" x="196.0366" y="401.8202">Health target returns HTTP 204?</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="124.1631" x="59.8735" y="392.4082">no: connection reset</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="13" lengthAdjust="spacing" textLength="20.059" x="402.0228" y="392.4082">yes</text><rect fill="#FFFFFF" height="57.648" rx="3" ry="3" style="stroke:#000000;stroke-width:1;" width="256.6652" x="18.