xt fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="354.1033" y="227.9214">no</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="234.9453" x="42.167" y="252.5156"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="214.9453" x="52.167" y="273.6543">Run a full VLESS + REALITY request</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="204.498" x="52.167" y="287.623">from independent external clients</text><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="284.9785" x="297.1123" y="252.5156"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="264.9785" x="307.1123" y="273.6543">Inspect DNS, firewall and upstream network</text><ellipse cx="439.6016" cy="331.4531" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="439.6016" cy="331.4531" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#FFFFFF" points="210.259,362.4531,388.9822,362.4531,400.9822,374.4531,388.9822,386.4531,210.259,386.4531,198.259,374.4531,210.259,362.4531" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="178.7231" x="210.259" y="378.2612">Health target returns HTTP 204?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="113.1099" x="85.1492" y="371.8589">no: connection reset</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="400.9822" y="371.8589">yes</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="255.8574" x="25.4048" y="396.4531"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="235.8574" x="35.4048" y="417.5918">Compare subscription and server fields</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="165.9902" x="35.4048" y="431.5605">without printing credentials</text><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="289.291" x="301.2622" y="396.4531"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="269.291" x="311.2622" y="417.5918">Inspect the Clash core and health-check URL</text><ellipse cx="445.9077" cy="475.3906" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="445.9077" cy="475.3906" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><rect fill="#FFFFFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="298.8359" x="150.2026" y="506.3906"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="278.8359" x="160.2026" y="527.5293">UUID, public key, short ID, SNI and flow match</text><rect fill="#FFFFFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1;" width="241.4141" x="178.9136" y="560.3594"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="193.4297" x="188.9136" y="581.498">Start a temporary Xray instance</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="221.4141" x="188.9136" y="595.4668">with the same inbound configuration</text><polygon fill="#FFFFFF" points="191.7341,628.2969,407.5071,628.2969,419.5071,640.2969,407.5071,652.2969,191.7341,652.2969,179.7341,640.2969,191.7341,628.2969" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="215.7729" x="191.7341" y="