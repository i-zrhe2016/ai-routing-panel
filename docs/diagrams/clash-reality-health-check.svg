7" x="169.5994" y="289.6515">yes: 127/128</text><text fill="#36575B" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="17.0239" x="407.2627" y="289.6515">no</text><rect fill="#F3F8F6" height="76.5438" rx="4" ry="4" style="stroke:#52777A;stroke-width:1;" width="261.1051" x="42.2319" y="329.8194"/><text fill="#24383B" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="225.1051" x="60.2319" y="364.0594">Run a full VLESS + REALITY request</text><text fill="#24383B" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="221.5771" x="61.9959" y="384.3313">from independent external clients</text><rect fill="#F3F8F6" height="56.2719" rx="4" ry="4" style="stroke:#52777A;stroke-width:1;" width="322.9568" x="323.337" y="329.8194"/><text fill="#24383B" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="286.9568" x="341.337" y="364.0594">Inspect DNS, firewall and upstream network</text><ellipse cx="484.8154" cy="432.0913" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="484.8154" cy="432.0913" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#F3F8F6" points="216.3463,465.7593,441.2535,465.7593,453.2535,483.8952,441.2535,502.0312,216.3463,502.0312,204.3463,483.8952,216.3463,465.7593" style="stroke:#52777A;stroke-width:1;"/><text fill="#24383B" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="208.9072" x="224.3463" y="489.9992">Health target returns HTTP 204?</text><text fill="#36575B" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="133.7134" x="62.6329" y="471.8632">no: connection reset</text><text fill="#36575B" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacing" textLength="21.6019" x="461.2535" y="471.8632">yes</text><rect fill="#F3F8F6" height="76.5438" rx="4" ry="4" style="stroke:#52777A;stroke-width:1;" width="29