apiVersion: batch/v1
kind: CronJob
metadata:
  name: xray-routing-panel-db-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            xray-routing-panel/node: "true"
          restartPolicy: OnFailure
          initContainers:
            - name: ensure-backup-runtime
              image: ghcr.io/your-org/xray-routing-panel:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "mkdir -p /shared-storage/runtime"]
              volumeMounts:
                - name: shared-storage
                  mountPath: /shared-storage
          containers:
            - name: backup
              image: ghcr.io/your-org/xray-routing-panel:latest
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /app/scripts/run_db_backup_cycle.py
              envFrom:
                - configMapRef:
                    name: xray-routing-panel-config
              env:
                - name: DB_PATH
                  value: /data/panel.db
                - name: DB_BACKUP_DIR
                  value: /backups
              volumeMounts:
                - name: shared-storage
                  mountPath: /data
                  subPath: data
                - name: shared-storage
                  mountPath: /backups
                  subPath: backups
                - name: shared-storage
                  mountPath: /app/xray/runtime
                  subPath: runtime
          volumes:
            - name: shared-storage
              persistentVolumeClaim:
                claimName: xray-routing-panel-shared
