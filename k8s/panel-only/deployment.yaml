apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray-routing-panel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xray-routing-panel
  template:
    metadata:
      labels:
        app: xray-routing-panel
    spec:
      nodeSelector:
        xray-routing-panel/node: "true"
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-shared-storage
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /shared/data /shared/runtime /shared/logs /shared/backups
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: shared-storage
              mountPath: /shared
      containers:
        - name: panel
          image: ghcr.io/your-org/xray-routing-panel:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: xray-routing-panel-config
          env:
            - name: DATA_DIR
              value: /data
            - name: DB_PATH
              value: /data/panel.db
            - name: XRAY_ENV_FILE_PATH
              value: /app/xray/.env
            - name: XRAY_CONFIG_PATH
              value: /app/xray/runtime/config.json
            - name: XRAY_PANEL_PORTS_PATH
              value: /app/xray/runtime/panel-ports.json
            - name: XRAY_ACCESS_LOG_PATH
              value: /app/xray/logs/access.log
            - name: XRAY_CLIENT_CONFIG_PATH
              value: /app/xray/runtime/client-test.json
            - name: DATAPLANE_CONTAINER_NAME
              value: ""
            - name: DATAPLANE_LOCAL_BIN
              value: ""
            - name: PANEL_HOST
              value: 0.0.0.0
            - name: PANEL_PORT
              value: "18080"
            - name: PANEL_HEALTH_REQUIRES_XRAY
              value: "0"
            - name: PANEL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: PANEL_USERNAME
            - name: PANEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: PANEL_PASSWORD
            - name: PANEL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: xray-routing-panel-secrets
                  key: PANEL_SECRET_KEY
          ports:
            - containerPort: 18080
              name: panel
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: shared-storage
              mountPath: /data
              subPath: data
            - name: shared-storage
              mountPath: /app/xray/runtime
              subPath: runtime
            - name: shared-storage
              mountPath: /app/xray/logs
              subPath: logs
            - name: xray-env
              mountPath: /app/xray/.env
              subPath: xray.env
              readOnly: true
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: xray-routing-panel-shared
        - name: xray-env
          secret:
            secretName: xray-routing-panel-secrets
