[SERVICE]
    Flush                 1
    Daemon                Off
    Log_Level             info
    storage.path          /buffers
    storage.sync          normal
    storage.checksum      off
    storage.backlog.mem_limit 32M
    Parsers_File          /fluent-bit/etc/parsers.conf
    HTTP_Server           On
    HTTP_Listen           127.0.0.1
    HTTP_Port             2020

[INPUT]
    Name                  tail
    Path                  /var/lib/docker/containers/*/*-json.log
    Parser                docker_json
    Tag                   docker.*
    Tag_Regex             (?<container_id>[a-f0-9]{64})-json\.log$
    DB                    /buffers/docker.db
    Mem_Buf_Limit         64M
    Read_from_Head        Off
    Skip_Long_Lines       On
    Refresh_Interval      10
    Rotate_Wait           30
    Path_Key              docker_log_path
    storage.type          filesystem

[INPUT]
    Name                  tail
    Path                  /var/log/xray/error.log
    Tag                   xray.error
    DB                    /buffers/xray-error.db
    Mem_Buf_Limit         16M
    Read_from_Head        Off
    Skip_Long_Lines       On
    Refresh_Interval      5
    Rotate_Wait           30
    storage.type          filesystem

[INPUT]
    Name                  tail
    Path                  /var/log/xray/ai-error.log
    Tag                   xray.ai.error
    DB                    /buffers/xray-ai-error.db
    Mem_Buf_Limit         16M
    Read_from_Head        Off
    Skip_Long_Lines       On
    Refresh_Interval      5
    Rotate_Wait           30
    storage.type          filesystem

[INPUT]
    Name                  systemd
    Tag                   systemd.*
    DB                    /buffers/systemd.db
    Read_From_Tail        On
    Systemd_Filter        _SYSTEMD_UNIT=${FLUENT_BIT_SYSTEMD_UNIT_1}
    Systemd_Filter        _SYSTEMD_UNIT=${FLUENT_BIT_SYSTEMD_UNIT_2}
    Systemd_Filter        _SYSTEMD_UNIT=${FLUENT_BIT_SYSTEMD_UNIT_3}
    Systemd_Filter        _SYSTEMD_UNIT=${FLUENT_BIT_SYSTEMD_UNIT_4}
    Strip_Underscores     On
    storage.type          filesystem

[FILTER]
    Name                  grep
    Match                 systemd.*
    Regex                 PRIORITY ^[0-3]$

[FILTER]
    Name                  modify
    Match                 docker.*
    Add                   node_role ${FLUENT_BIT_NODE_ROLE}
    Add                   host ${FLUENT_BIT_HOST}
    Add                   source docker
    Add                   pipeline fluent-bit

[FILTER]
    Name                  parser
    Match                 docker.*
    Key_Name              log
    Parser                panel_business_json
    Reserve_Data          On
    Preserve_Key          Off

[FILTER]
    Name                  modify
    Match                 docker.*
    Add                   category runtime
    Add                   level info

[FILTER]
    Name                  modify
    Match                 xray.*
    Add                   node_role ${FLUENT_BIT_NODE_ROLE}
    Add                   host ${FLUENT_BIT_HOST}
    Add                   source xray_error
    Add                   service xray
    Add                   pipeline fluent-bit
    Add                   category runtime
    Add                   level error

[FILTER]
    Name                  modify
    Match                 systemd.*
    Add                   node_role ${FLUENT_BIT_NODE_ROLE}
    Add                   host ${FLUENT_BIT_HOST}
    Add                   source systemd
    Add                   pipeline fluent-bit
    Add                   category runtime
    Add                   level error

[OUTPUT]
    Name                  loki
    Match                 *
    Host                  ${FLUENT_BIT_LOKI_HOST}
    Port                  ${FLUENT_BIT_LOKI_PORT}
    URI                   /loki/api/v1/push
    Labels                job=platform-logs
    Label_Keys            $node_role,$host,$category,$level,$source
    Line_Format           json
    Retry_Limit           False
    storage.total_limit_size ${FLUENT_BIT_STORAGE_LIMIT}
