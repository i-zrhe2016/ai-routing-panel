name: xray-log-store

services:
  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    restart: unless-stopped
    mem_limit: 384m
    network_mode: host
    command:
      - '-config.file=/etc/loki/loki.yml'
      - '-config.expand-env=true'
    environment:
      LOKI_TAILNET_BIND_ADDRESS: "${LOKI_TAILNET_BIND_ADDRESS:?set LOKI_TAILNET_BIND_ADDRESS}"
      LOKI_HTTP_PORT: "${LOKI_HTTP_PORT:-3100}"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

volumes:
  loki-data:
