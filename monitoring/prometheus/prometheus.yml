global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Panel business/liveness/xray metrics (token-gated /metrics on the host).
  - job_name: xray-panel
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["host.docker.internal:18080"]
        labels:
          role: control_plane
          host: panel

  # Host system metrics (CPU/mem/disk/network) via node_exporter on this box.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          host: panel
          provider: digitalocean
    # The DMIT data-plane node_exporter can be added here once deployed:
    #   - targets: ["64.186.224.96:9100"]
    #     labels: { host: dataplane, provider: dmit }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
