global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: xray-panel
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["host.docker.internal:18080"]
        labels:
          role: control_plane
          host: panel

  - job_name: control-plane-node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          host: panel
          role: control_plane
          provider: digitalocean

  - job_name: data-plane-node
    static_configs:
      - targets: ["64.186.224.96:19100"]
        labels:
          host: normal-data-plane
          node_role: normal_data_plane
      - targets: ["nat.qq.pw:19100"]
        labels:
          host: ai-data-plane
          node_role: ai_data_plane

  - job_name: data-plane-cadvisor
    static_configs:
      - targets: ["64.186.224.96:18081"]
        labels:
          host: normal-data-plane
          node_role: normal_data_plane
          xray_container: xray-reality-local
      - targets: ["nat.qq.pw:18081"]
        labels:
          host: ai-data-plane
          node_role: ai_data_plane
          xray_container: xray

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
